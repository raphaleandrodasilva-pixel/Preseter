name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.vscode/**'
      - '.opencode/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    name: Typecheck e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Testes do motor sem JUCE: relógio mestre (D1) e tempo do sequenciador (D4).
      - name: Relógio e sequenciador (C++ sem JUCE)
        run: |
          g++ -std=c++17 -O2 -Iengine/src engine/test/clock-phase/main.cpp -o clock-phase
          ./clock-phase
          g++ -std=c++17 -O2 -Iengine/src engine/test/drum-timing/main.cpp -o drum-timing
          ./drum-timing

  windows:
    name: Windows (NSIS)
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # O Wurly nativo (OpenWurli) é compilado em Rust pelo CMake.
      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine/third_party/openwurli

      # O JUCE vem por FetchContent; guardar a pasta evita baixar de novo.
      - uses: actions/cache@v4
        with:
          path: engine/build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('engine/CMakeLists.txt') }}
          restore-keys: juce-${{ runner.os }}-

      # O cache do _deps traz o CMakeCache do juceaide com o caminho do cl.exe
      # da imagem antiga. Quando o runner atualiza o MSVC, o configure falha
      # com "Failed to configure juceaide". Descartar só o build do JUCE
      # mantém o fonte em cache e evita o erro.
      - name: Descartar build antigo do JUCE
        shell: pwsh
        run: Remove-Item -Recurse -Force engine/build/_deps/juce-build -ErrorAction SilentlyContinue

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # O ASIO é sempre ligado no Windows: o JUCE 8.0.13 já traz os headers em
      # modules/juce_audio_devices/native/asio. Não depende de SDK externo nem
      # de download, então o build não pode sair sem ASIO por falha de rede.
      - name: Compilar o engine
        shell: pwsh
        run: |
          $cmakeArgs = @(
            '-S', 'engine',
            '-B', 'engine/build',
            '-G', 'Ninja',
            '-DCMAKE_BUILD_TYPE=Release',
            '-DPRESETER_ENABLE_ASIO=ON'
          )
          cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build engine/build --target PreseterEngine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - run: npm ci
      - run: npm run build

      - name: Empacotar instalador
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: preseter-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux (AppImage + deb)
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # O Wurly nativo (OpenWurli) é compilado em Rust pelo CMake.
      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine/third_party/openwurli

      - uses: actions/cache@v4
        with:
          path: engine/build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('engine/CMakeLists.txt') }}
          restore-keys: juce-${{ runner.os }}-

      # Mesma limpeza do job do Windows: o cache pode trazer um CMakeCache do
      # juceaide apontando para um compilador que não existe mais na imagem.
      - name: Descartar build antigo do JUCE
        run: rm -rf engine/build/_deps/juce-build

      - name: Instalar dependências do motor
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git ninja-build pkg-config \
            libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libx11-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxcursor-dev libgl1-mesa-dev

      - run: npm ci
      - run: npm run build:engine:linux
      - run: npm run build

      - name: Empacotar AppImage e deb
        run: npx electron-builder --linux AppImage deb --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: preseter-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    needs: [windows, linux]
    # Só publica a partir da main ou de uma tag; branches de teste geram apenas artefatos.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Ler versão do package.json
        id: version
        run: |
          version=$(node -e "console.log(require('./package.json').version)")
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # Tag manual manda; push na main publica quando a versão ainda não tem tag.
      # Tags/versões de teste (teste-* ou com "-") viram prerelease e não limpam estáveis.
      - name: Definir tag do release
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            name="${{ github.ref_name }}"
            echo "name=$name" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            if [[ "$name" == teste-* || "$name" == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            name="v${{ steps.version.outputs.value }}"
            echo "name=$name" >> "$GITHUB_OUTPUT"
            if git ls-remote --exit-code --tags origin "refs/tags/$name" >/dev/null 2>&1; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Baixar instaladores
        if: steps.tag.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Publicar no GitHub Releases
        if: steps.tag.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Preseter ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          prerelease: ${{ steps.tag.outputs.prerelease }}
          files: |
            dist-release/*.exe
            dist-release/*.exe.blockmap
            dist-release/*.AppImage
            dist-release/*.deb
            dist-release/latest.yml
            dist-release/latest-linux.yml

      # Mantém o release estável recém-publicado e o anterior; tags de teste nunca são apagadas.
      - name: Remover releases antigos
        if: steps.tag.outputs.publish == 'true' && steps.tag.outputs.prerelease == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_TAG: ${{ steps.tag.outputs.name }}
        run: |
          mapfile -t tags < <(gh release list --limit 100 --json tagName --jq '.[].tagName')
          kept_previous=0
          for tag in "${tags[@]}"; do
            if [ -z "$tag" ] || [ "$tag" = "$KEEP_TAG" ]; then
              continue
            fi
            # Só mexe em releases estáveis (v1.2.3); betas/testes ficam no ar.
            if [[ "$tag" != v* || "$tag" == *-* ]]; then
              echo "Mantendo release de teste: $tag"
              continue
            fi
            if [ "$kept_previous" -eq 0 ]; then
              kept_previous=1
              echo "Mantendo release anterior: $tag"
              continue
            fi
            echo "Removendo release antigo: $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          done

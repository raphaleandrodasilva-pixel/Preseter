name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    name: Typecheck e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  windows:
    name: Windows (NSIS)
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # O JUCE vem por FetchContent; guardar a pasta evita baixar de novo.
      - uses: actions/cache@v4
        with:
          path: engine/build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('engine/CMakeLists.txt') }}
          restore-keys: juce-${{ runner.os }}-

      # O SDK do ASIO não é versionado. Se o espelho falhar, o build segue sem ASIO.
      - name: Baixar SDK ASIO
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'asio-sdk'
          git clone --depth 1 https://github.com/audiosdk/asio.git $dest 2>$null
          if ($LASTEXITCODE -eq 0 -and (Test-Path (Join-Path $dest 'common/asio.h'))) {
            "PRESETER_ASIO_SDK_DIR=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "ASIO SDK pronto em $dest"
          } else {
            Write-Host "::warning::ASIO SDK indisponivel; o engine sera compilado sem ASIO."
          }

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compilar o engine
        shell: pwsh
        run: |
          $cmakeArgs = @('-S', 'engine', '-B', 'engine/build', '-G', 'Ninja', '-DCMAKE_BUILD_TYPE=Release')
          if ($env:PRESETER_ASIO_SDK_DIR) {
            $cmakeArgs += '-DPRESETER_ENABLE_ASIO=ON'
            $cmakeArgs += "-DPRESETER_ASIO_SDK_DIR=$env:PRESETER_ASIO_SDK_DIR"
          }
          cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build engine/build --target PreseterEngine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - run: npm ci
      - run: npm run build

      - name: Empacotar instalador
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: preseter-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux (AppImage + deb)
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/cache@v4
        with:
          path: engine/build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('engine/CMakeLists.txt') }}
          restore-keys: juce-${{ runner.os }}-

      - name: Instalar dependências do motor
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git ninja-build pkg-config \
            libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libx11-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxcursor-dev libgl1-mesa-dev

      - run: npm ci
      - run: npm run build:engine:linux
      - run: npm run build

      - name: Empacotar AppImage e deb
        run: npx electron-builder --linux AppImage deb --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: preseter-linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    needs: [windows, linux]
    # Só publica em push (main ou tag); execuções manuais geram apenas artefatos.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Ler versão do package.json
        id: version
        run: |
          version=$(node -e "console.log(require('./package.json').version)")
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # Tag manual manda; push na main publica quando a versão ainda não tem tag.
      - name: Definir tag do release
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            name="v${{ steps.version.outputs.value }}"
            echo "name=$name" >> "$GITHUB_OUTPUT"
            if git ls-remote --exit-code --tags origin "refs/tags/$name" >/dev/null 2>&1; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Baixar instaladores
        if: steps.tag.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Publicar no GitHub Releases
        if: steps.tag.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Preseter ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            dist-release/*.exe
            dist-release/*.exe.blockmap
            dist-release/*.AppImage
            dist-release/*.deb
